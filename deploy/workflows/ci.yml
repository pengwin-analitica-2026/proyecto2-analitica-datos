name: CI

# Pruebas en cada pull request hacia main y cada vez que main recibe cambios (merge o push).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias (torch para CPU primero, para no bajar la versión con CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt fastapi httpx pytest
      - name: Pruebas
        run: python -m unittest discover -s tests -v
