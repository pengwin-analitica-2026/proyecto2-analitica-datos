name: Deploy API de inferencia (AWS Lambda)

# Reconstruye la imagen de api/Dockerfile, la sube a ECR y actualiza la función Lambda.
# Se ejecuta en cada push a main (y a mano desde Actions). Autentica por OIDC con un rol de IAM. La función Lambda debe existir (se crea una vez a mano).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write               # OIDC: GitHub asume un rol de IAM, sin claves guardadas

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt fastapi httpx pytest
      - run: python -m unittest discover -s tests

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Las imágenes base (python, adaptador de Lambda) vienen del registro público de AWS. Sin iniciar
      # sesión, los runners de GitHub comparten IP y caen en el límite de descargas anónimas
      # (429 Too Many Requests); con sesión el límite es mucho mayor. ECR Public vive en us-east-1.
      - name: Iniciar sesión en ECR Public (evita el 429 al bajar las imágenes base)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
        env:
          AWS_REGION: us-east-1

      - name: Construir y subir la imagen
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --platform linux/amd64 --provenance=false -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Actualizar la función Lambda
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" \
            --image-uri "${{ steps.image.outputs.uri }}" > /dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"

      - name: Prueba de humo (/health)
        run: |
          URL=$(aws lambda get-function-url-config --function-name "$LAMBDA_FUNCTION" --query FunctionUrl --output text)
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 150 "${URL%/}/health?deep=1"
