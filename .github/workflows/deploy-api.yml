name: Deploy API de inferencia (AWS Lambda)

# Reconstruye la imagen de api/Dockerfile, la sube a ECR y actualiza la función Lambda.
# Se ejecuta al integrar cambios de la API, del código de inferencia o del checkpoint en main,
# o a mano desde la pestaña Actions. La función Lambda debe existir (se crea una vez a mano).

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "outputs/s10/d5_ema_w32_e60_s42.pth"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt fastapi httpx
      - run: python -m unittest discover -s tests

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws              # permite exigir aprobación manual en Settings → Environments
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir la imagen
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --platform linux/amd64 --provenance=false -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Actualizar la función Lambda
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" \
            --image-uri "${{ steps.image.outputs.uri }}" > /dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"

      - name: Prueba de humo (/health)
        run: |
          URL=$(aws lambda get-function-url-config --function-name "$LAMBDA_FUNCTION" --query FunctionUrl --output text)
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 120 "${URL%/}/health"
